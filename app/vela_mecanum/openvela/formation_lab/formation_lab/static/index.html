<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>openvela 四车编队实验台</title>
  <style>
    :root{color-scheme:dark;--bg:#08111c;--panel:#101d2a;--line:#24384b;--text:#e7f2fa;--muted:#8fa9bb;--cyan:#49d6c3;--orange:#ffb45c;--red:#ff6b6b}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 10% 0,#143044 0,transparent 35%),var(--bg);font-family:Inter,"Microsoft YaHei",sans-serif;color:var(--text)}
    header{padding:24px 28px 12px;display:flex;justify-content:space-between;align-items:end} h1{font-size:24px;margin:0;letter-spacing:.03em} .tag{color:var(--cyan);font:12px ui-monospace,monospace}
    main{padding:16px 28px 28px;display:grid;grid-template-columns:minmax(560px,1.7fr) minmax(320px,1fr);gap:18px;max-width:1500px;margin:auto}.panel{background:linear-gradient(145deg,#132332dd,#0d1824ee);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px #0005}
    .arena{padding:16px}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.state{font:700 13px ui-monospace,monospace;padding:7px 10px;border-radius:20px;background:#172d3e;color:var(--cyan)}canvas{display:block;width:100%;aspect-ratio:1.55;background:#07101a;border:1px solid #294154;border-radius:10px}
    aside{display:grid;gap:18px;align-content:start}.controls,.metrics,.events{padding:18px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:6px;font-size:12px;color:var(--muted)}select,input{width:100%;background:#09141f;border:1px solid #2c465b;color:var(--text);padding:10px;border-radius:8px}button{border:0;border-radius:8px;padding:11px 12px;font-weight:700;cursor:pointer;background:var(--cyan);color:#03201d}button.secondary{background:#273a4a;color:var(--text)}button.danger{background:var(--red);color:#2b0808}.buttons{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:9px;margin-top:14px}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:11px;background:#0a1520;border:1px solid #20374a;border-radius:9px}.metric span{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;margin-top:4px;font:700 17px ui-monospace,monospace}.events pre{height:150px;overflow:auto;white-space:pre-wrap;color:#aac0cf;background:#07101a;padding:12px;border-radius:8px;font-size:11px}.ok{color:var(--cyan)}.bad{color:var(--red)}
    @media(max-width:900px){main{grid-template-columns:1fr;padding:12px}header{padding:18px 14px}.arena{padding:10px}}
  </style>
</head>
<body>
<header><div><div class="tag">LOCAL DEVELOPMENT CONSOLE</div><h1>openvela 四车编队实验台</h1></div><div id="health" class="tag">连接中…</div></header>
<main>
  <section class="panel arena"><div class="bar"><h2>6 m × 6 m 安全场地</h2><div id="state" class="state">IDLE</div></div><canvas id="canvas" width="900" height="580"></canvas></section>
  <aside>
    <section class="panel controls"><h2>实验控制</h2><div class="grid">
      <label>编队<select id="formation"><option value="square">正方形</option><option value="line">直线</option><option value="circle">圆形</option><option value="diamond">菱形</option></select></label>
      <label>控制模型<select id="controlMode"><option value="anchored">槽位锚定（默认）</option><option value="laplacian">一阶 Laplacian 一致性</option><option value="second_order">二阶双积分一致性</option></select></label>
      <label>实验编号<input id="experimentId" value="demo-001"></label>
      <label>间距（米）<input id="spacing" type="number" min="0.35" max="2.5" step="0.05" value="0.8"></label>
      <label>保持时间（秒）<input id="duration" type="number" min="1" max="300" value="30"></label>
    </div><div class="buttons"><button onclick="startExperiment()">开始编队</button><button class="danger" onclick="command({action:'stop',reason:'dashboard_emergency_stop'})">紧急停止</button><button class="secondary" onclick="command({action:'reset'})">复位</button></div></section>
    <section class="panel metrics"><h2>实时指标</h2><div class="metric-grid"><div class="metric"><span>最大位置误差</span><strong id="error">—</strong></div><div class="metric"><span>最小车距</span><strong id="distance">—</strong></div><div class="metric"><span>已运行</span><strong id="elapsed">—</strong></div><div class="metric"><span>当前实验</span><strong id="current">—</strong></div></div></section>
    <section class="panel events"><h2>事件</h2><pre id="events">等待服务…</pre></section>
  </aside>
</main>
<script>
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d');let previous='';
const labels={Robot01:'#49d6c3',Robot02:'#ffb45c',Robot03:'#8e9dff',Robot04:'#ff6b9d'};
function log(t){const e=document.querySelector('#events');e.textContent=`${new Date().toLocaleTimeString()}  ${t}\n`+e.textContent.slice(0,1800)}
async function command(body){try{const r=await fetch('/api/v1/formation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.statusText);log(`${body.action}: ${j.experiment?.message||'OK'}`);render(j.experiment)}catch(e){log(`错误: ${e.message}`)}}
function startExperiment(){command({action:'start',experiment_id:document.querySelector('#experimentId').value,formation:document.querySelector('#formation').value,spacing_m:Number(document.querySelector('#spacing').value),duration_s:Number(document.querySelector('#duration').value),control_mode:document.querySelector('#controlMode').value})}
function render(e){if(!e)return;document.querySelector('#state').textContent=e.state;document.querySelector('#error').textContent=`${e.max_error_m.toFixed(3)} m`;document.querySelector('#distance').textContent=`${e.minimum_distance_m.toFixed(3)} m`;document.querySelector('#elapsed').textContent=`${e.elapsed_s.toFixed(1)} s`;document.querySelector('#current').textContent=e.experiment_id?`${e.experiment_id} · ${e.control_mode||'anchored'}`:'—';if(e.state!==previous){log(`状态 → ${e.state}: ${e.message} [${e.control_mode||'anchored'}]`);previous=e.state}
ctx.clearRect(0,0,canvas.width,canvas.height);const pad=38,s=Math.min((canvas.width-pad*2)/6,(canvas.height-pad*2)/6),cx=canvas.width/2,cy=canvas.height/2;ctx.strokeStyle='#1e384b';ctx.lineWidth=1;for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(cx+i*s,pad);ctx.lineTo(cx+i*s,canvas.height-pad);ctx.stroke();ctx.beginPath();ctx.moveTo(pad,cy+i*s);ctx.lineTo(canvas.width-pad,cy+i*s);ctx.stroke()}ctx.strokeStyle='#496175';ctx.lineWidth=2;ctx.strokeRect(cx-3*s,cy-3*s,6*s,6*s);
(e.robots||[]).forEach(r=>{const tx=cx+r.target_x*s,ty=cy-r.target_y*s,x=cx+r.x*s,y=cy-r.y*s,c=labels[r.robot_id];ctx.setLineDash([4,5]);ctx.strokeStyle=c+'77';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(tx,ty);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle=c;ctx.beginPath();ctx.arc(tx,ty,12,0,Math.PI*2);ctx.stroke();ctx.save();ctx.translate(x,y);ctx.rotate(-(r.yaw_rad||0));ctx.fillStyle=c;ctx.fillRect(-13,-9,26,18);ctx.fillStyle='#07101a';ctx.fillRect(5,-3,8,6);ctx.restore();ctx.fillStyle='#dceaf2';ctx.font='12px ui-monospace';ctx.fillText(r.robot_id,x+17,y+4)})}
async function poll(){try{const r=await fetch('/api/v1/state');const j=await r.json();document.querySelector('#health').textContent='● 本机服务在线';document.querySelector('#health').className='tag ok';render(j.experiment)}catch(e){document.querySelector('#health').textContent='● 服务离线';document.querySelector('#health').className='tag bad'}finally{setTimeout(poll,500)}}poll();
</script>
</body></html>
