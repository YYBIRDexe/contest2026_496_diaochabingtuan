<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>VelaGuard 巡检桌面 · 浏览器预览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /*
   * 触屏观感对齐手机：禁用浏览器默认的文本交互。
   *   user-select: none        长按拖拽不再选中文字、不出现蓝色高亮
   *   -webkit-touch-callout    长按不弹系统式菜单
   *   tap-highlight-color      点按不闪灰色高亮块
   *   -webkit-user-drag        禁止拖拽元素
   *   overscroll-behavior      禁止下拉刷新 / 橡皮筋回弹
   *   touch-action: manipulation 去掉双击缩放带来的 300ms 延迟
   * 界面里的文字都是展示性内容（标签、数值、状态），不需要被选中复制。
   */
  * {
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-drag: none;
    overscroll-behavior: none;
    touch-action: manipulation;
    /*
     * cursor: none —— 隐藏浏览器层的光标。
     *
     * 为什么 X 层隐藏了还要在这里再隐藏一次：
     * 触控屏上用户仍能看到指针，说明除了 X 的系统光标之外，
     * 浏览器还可能在页面内自绘光标（Firefox 在触屏/kiosk 场景下会这么做）。
     * XDefineCursor 只能管到 X 的光标，管不到浏览器自绘的那个。
     * 所以两层都要设。
     */
    cursor: none !important;
  }
  html, body {
    height: 100%;
    background: #05080f;
    color: #94a3b8;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #bar {
    height: 46px;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 18px;
    background: #0b1220;
    border-bottom: 1px solid #16223a;
    font-size: 13px;
  }
  #bar b { color: #e2e8f0; font-size: 14px; }
  #bar .sep { color: #334155; }
  #bar .spacer { flex: 1; }
  #bar button {
    background: #16223a; color: #cbd5e1; border: 1px solid #23324f;
    border-radius: 6px; padding: 5px 12px; font-size: 12px;
    font-family: inherit;
  }
  #bar button:hover { background: #1d2a44; }
  #bar button.on { background: #2f6df6; color: #fff; border-color: #2f6df6; }
  /* 看板模式：隐藏工具栏，界面独占整屏 */
  body.kiosk #bar { display: none; }
  body.kiosk #stage { top: 0; }
  #stage {
    position: absolute; top: 46px; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #frame {
    position: relative;
    overflow: hidden;
    background: #0b1220;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    transform-origin: center center;
  }
  /*
   * #root 是「设备屏幕」的根：让它本身也是列方向弹性容器，
   * 页面根节点才能拿到确定的 1280x800，height:100% 也才有正确的参照。
   */
  #root {
    display: flex;
    flex-direction: column;
    position: absolute;
    left: 0;
    top: 0;
    /* 弹性子项的 min-height 默认是 auto，会让内容撑破 800 高的屏幕框，
       导致 height:100% 解析成 896。清零后页面根节点才严格等于设备屏幕尺寸。 */
    min-height: 0;
    transform-origin: top left;
  }
  #toast {
    position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%);
    background: #2f6df6; color: #fff; padding: 12px 26px; border-radius: 20px;
    font-size: 16px; opacity: 0; transition: opacity .2s; pointer-events: none;
    z-index: 99; max-width: 80%;
  }
  #toast.show { opacity: 1; }
  .pv-icon { display: inline-block; background-size: 100% 100%; }
  .pv-glyph { display: block; }
  /*
   * Vela 控件的盒模型对齐（关键）：
   *   - Vela 的 <text> 是行内盒，没有宽高；
   *   - Vela 的 <div> 默认就是「列方向弹性容器」，也就是 display:flex + column，
   *     所以 .ux 里写 flex-direction: row 才会生效。普通 HTML 的 div 只是静态块，
   *     若不补齐这一层，所有横向排版都会退化成纵向堆叠。
   *   - <scroll> 是可滚动容器。
   * 只有对齐这几点，同一份 .ux 在浏览器与真机上的排版才一致。
   */
  span { display: inline; }
  img { display: block; }
  div, scroll { display: flex; flex-direction: column; }
  scroll { overflow: hidden; }
  .pv-hidden { display: none !important; }

<script>
  // 把模块初始化期的异常显示出来，避免白屏无从排查
  window.__err = ''
  function showErr(msg) {
    window.__err = String(msg)
    var d = document.getElementById('errbox')
    if (d) { d.textContent = String(msg); d.style.display = 'block' }
  }
  window.addEventListener('error', function (e) {
    showErr((e.message || 'error') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0))
  })
  window.addEventListener('unhandledrejection', function (e) {
    showErr('rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason))
  })
</script>

/* ------------------------------------------------------------------ *

const CARS = [
  { id: 'CAR-1', zoneId: 'Z1', zone: '入口大厅', ip: '192.168.4.11', online: true, battery: 86, link: '良好' },
  { id: 'CAR-2', zoneId: 'Z2', zone: '主通道', ip: '192.168.4.12', online: true, battery: 72, link: '良好' },

/* ------------------------------------------------------------------ *
 * 3. 状态字典：任务状态机的 5 种态

const STATUS = {

/* ------------------------------------------------------------------ *

/* ------------------------------------------------------------------ *
 * 5. 数据访问与汇总（功能四：巡检覆盖的基础汇总）
 * ------------------------------------------------------------------ */
function getZones() {
  return ZONES.map(function (z) {
    return Object.assign({}, z)
  })
}
function getCars() {
  return CARS.map(function (c) {
    return Object.assign({}, c)
  })
}
function getRecords() {
  return RECORDS.map(function (r) {
    return {
      round: r.round,
      time: r.time,
      summary: r.summary,
      zones: r.zones.map(function (z) {
        return { name: z.name, result: z.result }
      })
    }
  })
}
function statusOf(key) {
  return STATUS[key] || STATUS.idle
}

/**
 * 一轮巡检的覆盖汇总，供桌面概览卡片使用。
 */
function summarize() {
  const counts = { done: 0, running: 0, blocked: 0, idle: 0, offline: 0 }
  ZONES.forEach(function (z) {
    const key = CARS.filter(function (c) {
      return c.id === z.car
    })[0]
    if (key && !key.online) {
      counts.offline += 1
    } else {
      counts[z.status] += 1
    }
  })
  return {
    total: ZONES.length,
    counts: counts,
    doneText: counts.done + ' / ' + ZONES.length,
    needAction: counts.blocked + counts.offline
  }
}

/* ------------------------------------------------------------------ *
 * 6. 派单与取消（功能二：任务派单与结果回收）
 *
 * 真实实现应在此处通过 C1 Wi-Fi 发送「任务单」报文：
 *   任务序号 / 目标车辆 / 区域或路线编号 / 取消标记
 * 并等待带同一任务序号的「状态回执」。
 * 首期用内存状态代替，保证界面闭环可演示。
 * ------------------------------------------------------------------ */
let taskSeq = 1000
function dispatchTask(zoneId) {
  const zone = ZONES.filter(function (z) {
    return z.id === zoneId
  })[0]
  if (!zone) {
    return { ok: false, message: '区域不存在' }
  }
  const car = CARS.filter(function (c) {
    return c.id === zone.car
  })[0]
  if (car && !car.online) {
    return { ok: false, message: zone.car + ' 离线，请检查车辆或改为降级方案' }
  }
  taskSeq += 1
  zone.status = 'running'
  zone.statusText = '进行中'
  zone.progress = 5
  zone.detail = '任务单已下发，等待车端回执'
  zone.duration = '刚刚'
  return { ok: true, seq: taskSeq, message: '已向 ' + zone.car + ' 下发「' + zone.name + '」任务单' }
}
function cancelTask(zoneId) {
  const zone = ZONES.filter(function (z) {
    return z.id === zoneId
  })[0]
  if (!zone) {
    return { ok: false, message: '区域不存在' }
  }
  zone.status = 'idle'
  zone.statusText = '未开始'
  zone.progress = 0
  zone.detail = '任务已取消，等待重新派发'
  zone.duration = '—'
  return { ok: true, message: '已取消「' + zone.name + '」任务' }
}

/**
 * 一键取消本轮全部未完成任务（对应 U1P 按键的「一键取消」入口）。
 */
function cancelAll() {
  let n = 0
  ZONES.forEach(function (z) {
    if (z.status === 'running' || z.status === 'blocked') {
      z.status = 'idle'
      z.statusText = '未开始'
      z.progress = 0
      z.detail = '任务已取消，等待重新派发'
      z.duration = '—'
      n += 1
    }
  })
  return { ok: true, message: n > 0 ? '已取消 ' + n + ' 个未完成任务' : '当前没有待取消的任务' }
}

/**
 * 标记任务完成（供在线模拟与真实状态回执使用）。
 * 真实接入时，这里就是「收到车端完成回执」的处理点。
 */
function markDone(zoneId, detail) {
  const zone = ZONES.filter(function (z) {
    return z.id === zoneId
  })[0]
  if (!zone) {
    return { ok: false, message: '区域不存在' }
  }
  zone.status = 'done'
  zone.statusText = '已完成'
  zone.progress = 100
  zone.detail = detail || '路线执行完毕，未发现异常'
  return { ok: true, message: '「' + zone.name + '」已完成' }
}

/* ---- 内联 src/common/source.js（依赖上面的 store，顺序不能调） ---- */
/**
 * VelaGuard 数据源适配层
 *
 * 目的：把「界面」与「数据从哪来」彻底解耦。
 *
 * 界面只认一种东西——**状态快照（snapshot）**：
 *
 *   {
 *     zones:     [...],   // 区域列表，字段见 store.js 的 ZONES
 *     cars:      [...],   // 车辆列表
 *     records:   [...],   // 历史轮次
 *     summary:   {...},   // 汇总计数 { total, counts, doneText, needAction }
 *     source:    'demo' | 'file' | 'sim',
 *     sourceText:'演示数据' 等中文说明
 *     connected: true/false,
 *     lastUpdate: Date,
 *     lastUpdateText: '刚刚' / 'HH:MM:SS'
 *   }
 *
 * 三种实现（可通过 URL 参数或界面切换，见 control）：
 *
 *   1. demo —— 用 store.js 的端侧预设表演示，派单/取消直接改内存。
 *              完全离线可用，是不接车也能演示的兜底模式。
 *
 *   2. file —— 轮询读取 data/state.json，作为真实数据的接入点。
 *              把 M1 上的采集程序写到这个文件，界面就会跟着变。
 *              （M1 是 Linux，最省事的落地方式）
 *              另外还支持 data/command.json 下发指令（单向的文件桥）。
 *
 *   3. sim  —— 在线模拟：按脚本自动推进任务状态（派单→进行中→完成/阻塞），
 *              用来验证「界面是否真的会跟着数据变」，不作为交付模式。
 *
 * 接真机时只需新增/替换一个 adapter；界面代码一行不用改。
 */

/* ================================================================== *
 * 1. 演示数据源：包在 store 外面，接口与其它数据源一致
 * ================================================================== */
function createDemoAdapter() {
  return {
    name: 'demo',
    sourceText: '演示数据',
    available: true,
    unavailableReason: '',
    async start() {},
    stop() {},

    get() {
      return {
        zones: store.getZones(),
        cars: store.getCars(),
        records: store.getRecords(),
        summary: store.summarize(),
        source: 'demo',
        sourceText: '演示数据',
        connected: true,
        lastUpdate: new Date(),
        lastUpdateText: '本地'
      }
    },

    dispatch(zoneId) {
      return store.dispatchTask(zoneId)
    },
    cancel(zoneId) {
      return store.cancelTask(zoneId)
    },
    cancelAll() {
      return store.cancelAll()
    }
  }
}

/* ================================================================== *
 * 2. 文件数据源：轮询 state.json 读取真实状态，通过 HTTP 接口下发指令
 *
 * 这是接 M1 真实数据的推荐入口：M1 侧只需要定期把巡检状态写成 JSON。
 *
 * 注意两点（都踩过）：
 *   a) URL 用绝对路径 '/data/state.json'。
 *      用相对路径 'data/state.json' 会以「当前页面」为基准解析成
 *      /preview/data/state.json，直接 404。
 *   b) 必须经 HTTP 提供，不能放在 file:// 下。
 *      浏览器禁止 file:// 页面发起 fetch（跨源限制），
 *      所以 file:// 打开时该数据源不可用，会自动回退到演示数据。
 *      正式部署请用 `node tools/serve.js` 或 M1 上的本地 Web 服务。
 * ================================================================== */
function createFileAdapter(options) {
  const opts = options || {}
  const stateUrl = opts.stateUrl || '/data/state.json'
  const commandUrl = opts.commandUrl || '/api/command'
  /*
   * 轮询间隔：**5 秒**（用户要求「每 5s 根据检测的参数更新一次页面数据」）。
   * 设备侧由 linux/car_state.py 每 5 秒真去探测四台车（在线/电量）并写
   * state.json，两边节奏对齐，页面上看到的永远是最近 5 秒内的实测值。
   */
  const period = opts.period || 5000

  let timer = null
  let last = null
  let listener = null

  /** file:// 下 fetch 会被浏览器拒绝，提前判定，避免无意义的报错刷屏 */
  function usable() {
    return String(location.protocol).indexOf('http') === 0
  }

  function unavailableReason() {
    return 'file:// 下无法读取数据接口，请用 http 方式打开（node tools/serve.js）'
  }

  /** 把外部 JSON 规整成状态快照，缺字段时用演示数据兜底，避免界面崩掉 */
  function normalize(raw) {
    if (!raw || !raw.zones) {
      return null
    }
    const zones = raw.zones.map(function (z) {
      return {
        id: z.id,
        name: z.name,
        route: z.route || '—',
        routeDesc: z.routeDesc || '—',
        car: z.car || '—',
        status: z.status || 'idle',
        statusText: z.statusText || store.statusOf(z.status || 'idle').text,
        progress: typeof z.progress === 'number' ? z.progress : 0,
        detail: z.detail || '',
        duration: z.duration || '—'
      }
    })
    const cars = (raw.cars || []).map(function (c) {
      return {
        id: c.id,
        zoneId: c.zoneId || '',
        zone: c.zone || '—',
        ip: c.ip || '—',
        online: !!c.online,
        battery: typeof c.battery === 'number' ? c.battery : 0,
        link: c.online ? '良好' : '离线'
      }
    })
    const counts = { done: 0, running: 0, blocked: 0, idle: 0, offline: 0 }
    zones.forEach(function (z) {
      const offlineCar = cars.filter(function (c) {
        return c.id === z.car && !c.online
      })[0]
      if (offlineCar) {
        counts.offline += 1
      } else if (counts[z.status] !== undefined) {
        counts[z.status] += 1
      }
    })
    return {
      zones: zones,
      cars: cars,
      records: raw.records || store.getRecords(),
      summary: {
        total: zones.length,
        counts: counts,
        doneText: counts.done + ' / ' + zones.length,
        needAction: counts.blocked + counts.offline
      },
      source: 'file',
      sourceText: 'M1 数据',
      connected: true,
      lastUpdate: new Date(),
      lastUpdateText: '刚刚'
    }
  }

  async function poll() {
    if (!usable()) {
      if (last) {
        last.connected = false
        last.lastUpdateText = 'file:// 不可用'
      }
      return
    }
    try {
      const res = await fetch(stateUrl + '?t=' + Date.now(), { cache: 'no-store' })
      if (!res.ok) {
        throw new Error('HTTP ' + res.status)
      }
      const snap = normalize(await res.json())
      if (snap) {
        last = snap
        if (listener) {
          listener(snap)
        }
      }
    } catch (e) {
      // 文件不存在或读不到：标记断连，但不抛错、不清空已有数据
      if (last) {
        last.connected = false
        last.lastUpdateText = '连接断开'
      }
    }
  }

  return {
    name: 'file',
    sourceText: 'M1 数据',
    start() {
      poll()
      timer = setInterval(poll, period)
    },
    stop() {
      if (timer) {
        clearInterval(timer)
        timer = null
      }
    },
    get() {
      return last
    },
    /** 该数据源在当前环境下是否可用（供界面给出准确提示） */
    get available() {
      return usable()
    },
    get unavailableReason() {
      return usable() ? '' : unavailableReason()
    },
    onUpdate(fn) {
      listener = fn
    },

    /**
     * 下发指令：写一个命令文件。
     * 注意——单靠 file:// 页面无法写文件（浏览器沙箱限制），
     * 正式使用时把 commandUrl 指向一个本地 HTTP 接口即可。
     */
    async dispatch(zoneId) {
      return await sendCommand({ action: 'dispatch', zoneId: zoneId, at: Date.now() })
    },
    async cancel(zoneId) {
      return await sendCommand({ action: 'cancel', zoneId: zoneId, at: Date.now() })
    },
    async cancelAll() {
      return await sendCommand({ action: 'cancelAll', at: Date.now() })
    }
  }

  async function sendCommand(payload) {
    try {
      const res = await fetch(commandUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      if (!res.ok) {
        throw new Error('HTTP ' + res.status)
      }
      return { ok: true, message: '指令已下发' }
    } catch (e) {
      return {
        ok: false,
        message: '指令通道未接通（需要本地 HTTP 接口，file:// 下无法写文件）'
      }
    }
  }
}

/* ================================================================== *
 * 3. 在线模拟数据源：按脚本推进状态，验证「数据变→界面变」
 * ================================================================== */
function createSimAdapter(options) {
  const opts = options || {}
  const period = opts.period || 4000
  let timer = null
  let listener = null
  let step = 0

  /** 推进一步：让进行中的任务前进到完成，或把未开始的派出去 */
  function tick() {
    const zones = store.getZones()
    let changed = false

    zones.forEach(function (z) {
      if (z.status === 'running') {
        z.progress = Math.min(100, z.progress + 17)
        changed = true
        if (z.progress >= 100) {
          store.markDone(z.id)
        }
      } else if (z.status === 'idle' && step % 3 === 0) {
        store.dispatchTask(z.id)
        changed = true
      } else if (z.status === 'blocked' && step % 4 === 3) {
        store.cancelTask(z.id)
        changed = true
      }
    })

    step += 1
    // 注意：不能在回调里用 this，必须走闭包里的 self
    if (changed && listener) {
      listener(self.get())
    }
  }

  const self = {
    name: 'sim',
    sourceText: '在线模拟',
    available: true,
    unavailableReason: '',
    start() {
      step = 0
      timer = setInterval(tick, period)
    },
    stop() {
      if (timer) {
        clearInterval(timer)
        timer = null
      }
    },
    get() {
      return {
        zones: store.getZones(),
        cars: store.getCars(),
        records: store.getRecords(),
        summary: store.summarize(),
        source: 'sim',
        sourceText: '在线模拟',
        connected: true,
        lastUpdate: new Date(),
        lastUpdateText: '刚刚'
      }
    },
    onUpdate(fn) {
      listener = fn
    },
    dispatch(zoneId) {
      return store.dispatchTask(zoneId)
    },
    cancel(zoneId) {
      return store.cancelTask(zoneId)
    },
    cancelAll() {
      return store.cancelAll()
    }
  }
  return self
}

/* ================================================================== *
 * 4. 统一入口：负责选择数据源、暴露订阅、并提供模式切换
 * ================================================================== */
function createSource(initialMode) {
  const adapters = {
    demo: createDemoAdapter(),
    file: createFileAdapter({}),
    sim: createSimAdapter({})
  }

  let current = null
  let listener = null

  function attach(name) {
    if (current) {
      // 必须先停掉旧适配器，否则它的轮询定时器会在后台一直跑，
      // 频繁切源会不断累积定时器（隐性资源泄漏）。
      if (current.stop) {
        current.stop()
      }
      if (current.onUpdate) {
        current.onUpdate(null)
      }
    }
    current = adapters[name] || adapters.demo
    if (current.onUpdate) {
      current.onUpdate(function (snap) {
        if (listener) {
          listener(snap)
        }
      })
    }
    if (current.start) {
      current.start()
    }
    return current
  }

  const source = {
    get name() {
      return current ? current.name : 'demo'
    },

    /** 当前状态快照，可能为 null（file 模式首次还没读到） */
    get() {
      return current ? current.get() : null
    },

    /** 订阅数据变化；返回取消订阅函数 */
    onUpdate(fn) {
      listener = fn
      return function () {
        listener = null
      }
    },

    /** 切换数据源 */
    setMode(name) {
      attach(name)
      if (listener) {
        listener(source.get())
      }
      return source.name
    },

    /** 当前数据源在该环境下是否可用（file:// 下 file 源不可用） */
    get available() {
      return current ? current.available !== false : true
    },
    get unavailableReason() {
      return current && current.unavailableReason ? current.unavailableReason : ''
    },

    /* --- 业务操作：委托给当前数据源，界面不需要知道用的是哪种 --- */
    async dispatch(zoneId) {
      return await current.dispatch(zoneId)
    },
    async cancel(zoneId) {
      return await current.cancel(zoneId)
    },
    async cancelAll() {
      return await current.cancelAll()
    }
  }

  attach(initialMode || 'demo')
  return source
}

/* ---- 适配层结束 ---- */

/**
 * 数据源实例（唯一数据入口）。
 * 模式优先级：URL 参数 ?src= > 无网络时的默认 demo。
 * 页面只通过它读写数据，不知道背后是演示、文件还是真实链路。
 */
const DEFAULT_SRC = (function () {
  const m = String(location.search || '').match(/[?&]src=(demo|file|sim)/)
  return m ? m[1] : 'demo'
})()

const source = createSource(DEFAULT_SRC)

/* 兼容：部分页面还按 store 风格调用，这里给一个等价视图 */
const store = {
  getZones: getZones,
  getCars: getCars,
  getRecords: getRecords,
  statusOf: statusOf,
  summarize: summarize,
  dispatchTask: dispatchTask,
  cancelTask: cancelTask,
  cancelAll: cancelAll,

const PAGES = {"Home":{"name":"Home","path":"/","html":"<div class=\"screen\">\n    <!-- ============ 状态栏：时间 / 通信 / 电源 ============ -->\n    <div class=\"statusbar\">\n      <div class=\"sb-left\">\n        <span class=\"sb-time\"><b data-bind=\"now\"></b></span>\n        <span class=\"sb-label\">VelaGuard 巡检桌面</span>\n      </div>\n      <div class=\"sb-right\">\n        <div class=\"chip\" data-style=\"srcStyle\" data-act=\"toggleSource\">\n          <span class=\"chip-text\" data-style=\"srcTextStyle\"><b data-bind=\"srcText\"></b></span>\n        </div>\n        <div class=\"chip chip-warn\">\n          <span class=\"chip-text-warn\"><b data-bind=\"onlineText\"></b></span>\n        </div>\n        <span class=\"sb-battery\">电池 <b data-bind=\"battery\"></b>%</span>\n      </div>\n    </div>\n\n    <!-- ============ 概览区：本轮巡检的一句话结论 ============ -->\n    <div class=\"hero\">\n      <div class=\"hero-head\">\n        <span class=\"hero-title\">本轮巡检 · 第 3 轮</span>\n        <span class=\"hero-src\"><b data-bind=\"srcDetail\"></b></span>\n      </div>\n      <span class=\"hero-main\"><b data-bind=\"summaryLine\"></b></span>\n      <div class=\"hero-stats\">\n        <div class=\"stat\">\n          <span class=\"stat-num num-done\"><b data-bind=\"counts.done\"></b></span>\n          <span class=\"stat-label\">已完成</span>\n        </div>\n        <div class=\"stat\">\n          <span class=\"stat-num num-run\"><b data-bind=\"counts.running\"></b></span>\n          <span class=\"stat-label\">进行中</span>\n        </div>\n        <div class=\"stat\">\n          <span class=\"stat-num num-block\"><b data-bind=\"counts.blocked\"></b></span>\n          <span class=\"stat-label\">阻塞</span>\n        </div>\n        <div class=\"stat\">\n          <span class=\"stat-num num-idle\"><b data-bind=\"counts.idle\"></b></span>\n          <span class=\"stat-label\">未开始</span>\n        </div>\n        <div class=\"stat\">\n          <span class=\"stat-num num-off\"><b data-bind=\"counts.off   background-color: #0b1220;\n  }\n[data-page=\"Home\"] .statusbar {\n\n    flex-direction: row;\n    justify-content: space-between;\n    align-items: center;\n    height: 56px;\n    margin-bottom: 14px;\n  }\n[data-page=\"Home\"] .sb-left {\n\n    flex-direction: row;\n    align-items: center;\n  }\n[data-page=\"Home\"] .sb-time {\n\n    font-size: 40px;\n    font-weight: bold;\n    color: #ffffff;\n  }\n[data-page=\"Home\"] .sb-label {\n\n    font-size: 27px;\n    color: #64748b;\n    margin-left: 20px;\n  }\n[data-page=\"Home\"] .sb-right {\n\n    flex-direction: row;\n    align-items: center;\n  }\n[data-page=\"Home\"] .sb-battery {\n\n    font-size: 27px;\n    color: #94a3b8;\n    margin-left: 18px;\n  }\n[data-page=\"Home\"] .chip {\n\n    justify-content: center;\n    align-items: center;\n    \n    min-height: 60px;\n    padding: 8px 22px 8px 22px;\n    border-radius: 26px;\n    margin-left: 16px;\n  }\n[data-page=\"Home\"] .chip-warn {\n\n    background-color: rgba(251, 191, 36, 0.16);\n  }\n[data-page=\"Home\"] .chip-text-warn {\n\n    font-size: 25px;\n    color: #fbbf24;\n  }\n[data-page=\"Home\"] .chip-text {\n\n    font-size: 25px;\n    color: #a9c1e0;\n  }\n[data-page=\"Home\"] .hero {\n\n    flex-direction: column;\n    width: 100%;\n    padding: 16px 32px 14px 32px;\n    border-radius: 30px;\n    background-color: #16223a;\n  }\n[data-page=\"Home\"] .hero-title {\n\n    font-size: 27px;\n    color: #7d8ea8;\n  }\n[data-page=\"Home\"] .hero-head {\n\n    flex-direction: row;\n    justify-content: space-between;\n    align-items: center;\n  }\n[data-page=\"Home\"] .hero-src {\n\n    font-size: 24px;\n    color: #64748b;\n  }\n[data-page=\"Home\"] .hero-main {\n\n    font-size: 40px;\n    font-weight: bold;\n    color: #e2e8f0;\n    margin-top: 8px;\n  }\n[data-page=\"Home\"] .hero-stats {\n\n    flex-direction: row;\n    margin-top: 10px;\n  }\n[data-page=\"Home\"] .stat {\n\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    width: 220px;\n    padding: 4px 0px 4px 0px;\n  }\n[data-page=\"Home\"] .stat-num {\n\n    font-size: 42px;\n    font-weight: bold;\n  }\n[data-page=\"Home\"] .num-done {\n\n    color: #3ddc84;\n  }\n[data-page=\"Home\"] .num-run {\n\n    color: #4da3ff;\n  }\n[data-page=\"Home\"] .num-block {\n\n    color: #ff6b6b;\n  }\n[data-page=\"Home\"] .num-idle {\n\n    color: #94a3b8;\n  }\n[data-page=\"Home\"] .num-off {\n\n    color: #fbbf24;\n  }\n[data-page=\"Home\"] .stat-label {\n\n    font-size: 25px;\n    color: #7d8ea8;\n    margin-top: 4px;\n  }\n[data-page=\"Home\"] .section-title {\n\n    font-size: 28px;\n    color: #7d8ea8;\n    margin-top: 12px;\n    margin-bottom: 10px;\n  }\n[data-page=\"Home\"] .grid {\n\n    flex: 1;\n    flex-direction: row;\n    flex-wrap: wrap;\n    width: 100%;\n  }\n[data-page=\"Home\"] .tile {\n\n    flex-direction: column;\n    align-items: center;\n    justify-content: center;\n    width: 600px;\n    height: 138px;\n    padding: 6px 14px 6px 14px;\n    margin: 0px 24px 12px 0px;\n    border-radius: 26px;\n    background-color: #16223a;\n  }\n[data-page=\"Home\"] .tile-icon-wrap {\n\n    width: 70px;\n    height: 70px;\n    border-radius: 20px;\n    justify-content: center;\n    align-items: center;\n  }\n[data-page=\"Home\"] .tile-glyph {\n\n    font-size: 36px;\n    color: #ffffff;\n  }\n[data-page=\"Home\"] .tile-name {\n\n    font-size: 26px;\n    font-weight: bold;\n    color: #e2e8f0;\n    margin-top: 6px;\n  }\n[data-page=\"Home\"] .tile-sub {\n\n    font-size: 21px;\n    color: #7d8ea8;\n    margin-top: 2px;\n  }\n[data-page=\"Home\"] .zstrip {\n\n    flex-direction: row;\n    flex-wrap: wrap;\n    width: 100%;\n    margin-bottom: 2px;\n  }\n[data-page=\"Home\"] .zchip {\n\n    flex-direction: row;\n    align-items: center;\n    height: 46px;\n    padding: 0px 18px 0px 16px;\n    margin: 0px 14px 6px 0px;\n    border-radius: 23px;\n    background-color: #16223a;\n  }\n[data-page=\"Home\"] .zdot {\n\n    width: 14px;\n    height: 14px;\n    border-radius: 7px;\n    margin-right: 10px;\n  }\n[data-page=\"Home\"] .zname {\n\n    font-size: 24px;\n    color: #cbd5e1;\n    margin-right: 10px;\n  }\n[data-page=\"Home\"] .zstate {\n\n    font-size: 23px;\n    font-weight: bold;\n  }\n[data-page=\"Home\"] .dock {\n\n    flex-direction: row;\n    align-items: center;\n    width: 100%;\n    height: 68px;\n    margin-top: 0px;\n    padding: 0px 0px 0px 0px;\n    background-color: transparent;\n  }\n[data-page=\"Home\"] .dock-btn {\n\n    justify-content: center;\n    align-items: center;\n    height: 60px;\n    padding: 0px 26px 0px 26px;\n    margin-right: 16px;\n    border-radius: 26px;\n    background-color: #23324f;\n  }\n[data-page=\"Home\"] .dock-primary {\n\n    background-color: #2f6df6;\n  }\n[data-page=\"Home\"] .dock-text {\n\n    font-size: 26px;\n    color: #cbd5e1;\n  }\n[data-page=\"Home\"] .dock-text-primary {\n\n    font-size: 26px;\n    font-weight: bold;\n    color: #ffffff;\n  }\n[data-page=\"Home\"] .dock-hint {\n\n    flex: 1;\n    font-size: 22px;\n    color: #64748b;\n    text-align: right;\n  }\n[data-page=\"Home\"] .toast {\n\n    position: absolute;\n    left: 360px;\n    bottom: 150px;\n    padding: 20px 36px 20px 36px;\n    border-radius: 24px;\n    background-color: #2f6df6;\n  }\n[data-page=\"Home\"] .toast-text {\n\n    font-size: 28px;\n    color: #ffffff;\n  }","script":"\n\n\n\n  return {\n    private: {\n      // 初始占位符，startClock() 会立刻用真实时间覆盖（不要写死一个时间，\n      // 那样在时钟还没跑起来的一瞬间会看到假的\"14:26\"）\n      now: '— —',\n      battery: 86,\n      onlineText: '3 / 4 车在线',\n      summaryLine: '—',\n      srcText: '演示数据',\n      srcStyle: 'background-color: rgba(148, 163, 184, 0.16)',\n      srcTextStyle: 'color: #94a3b8',\n      srcDetail: '数据来自端侧预设表，未接真实链路',\n      counts: { done: 0, running: 0, blocked: 0, idle: 0, offline: 0 },\n      zoneChips: [],\n      toast: '',\n      // 应用注册表：新增一个 app 只需在这里加一条，磁贴会自动出现\n      appRegistry: [\n        { name: '巡检调度台', sub: '派单与状态', glyph: '巡', uri: '/dispatch', color: '#2F6DF6' },\n        { name: '语音助手', sub: '端侧 AI 对话', glyph: '语', uri: '/voice', color: '#0EA5A4' },\n        { name: '区域与路线', sub: '4 区 4 路线', glyph: '区', uri: '/zones', color: '#7C5CFF' },\n        { name: '巡检记录', sub: '按轮次回看', glyph: '记', uri: '/records', color: '#F59E0B' },\n        { name: '系统与网络', sub: 'Wi-Fi / 模型', glyph: '设', uri: '/system', color: '#64748B' }\n      ],\n      // 模板直接渲染的栅格数据（图标底色通过 style 绑定注入）\n      tiles: []\n    },\n\n    onInit() {\n      this.renderTiles()\n      this.refresh()\n      this.startClock()\n      // 订阅数据源：数据一变就重绘，真实链路接入后无需改这里\n      const self = this\n      source.onUpdate(function () {\n        self.refresh()\n      })\n    },\n\n\n\n\n\n\n\n\n\n\n\n    startClock() {\n      const pad = function (n) { return n < 10 ? '0' + n : '' + n }\n      const tick = () => {\n        const d = new Date()\n        this.now = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +\n          ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds())\n      }\n      tick()\n      setInterval(tick, 1000)\n    },\n\n    onShow() {\n      this.refresh()\n    },\n\n    onRefresh() {\n      this.refresh()\n    },\n\n\n    refresh() {\n      const snap = source.get()\n      if (!snap) {\n        this.summaryLine = '正在连接数据源…'\n        return\n      }\n      const s = snap.summary\n      this.counts = s.counts\n\n      let online = 0\n      let battery = 0\n      snap.cars.forEach(function (c) {\n        if (c.online) {\n          online += 1\n          battery = battery > c.battery ? battery : c.battery\n        }\n      })\n      this.onlineText = online + ' / ' + snap.cars.length + ' 车在线'\n      this.battery = battery\n\n      // 区域状态条：一眼看清每个区域当前处于什么状态\n      this.zoneChips = snap.zones.map(function (z) {\n        const st = store.statusOf(z.status)\n        return {\n          name: z.name,\n          statusText: z.statusText,\n          dotStyle: 'background-color: ' + st.color,\n          textStyle: 'color: ' + st.color\n        }\n      })\n\n      // 数据源指示：让运维一眼看出当前是演示数据还是真实链路\n      this.srcText = snap.sourceText + (snap.connected ? '' : ' · 断连')\n      this.srcStyle = snap.connected\n        ? 'background-color: rgba(61, 220, 132, 0.16)'\n        : 'background-color: rgba(255, 107, 107, 0.16)'\n      this.srcTextStyle = snap.connected ? 'color: #3ddc84' : 'color: #ff6b6b'\n      this.srcDetail = '数据来源：' + snap.sourceText +\n        ' · 更新于 ' + snap.lastUpdateText\n\n      if (s.needAction > 0) {\n        this.summaryLine = s.total + ' 区中 ' + s.counts.done + ' 区已完成，' +\n          s.counts.blocked + ' 区阻塞待重派，' + s.counts.offline + ' 区车辆离线'\n      } else if (s.counts.running > 0) {\n        this.summaryLine = '巡检进行中，已收回 ' + s.counts.done + ' 区结果'\n      } else {\n        this.summaryLine = '四区全部完成，本轮无异常'\n      }\n    },\n\n\n\n\n\n\n\n\n    toggleSource() {\n      const order = ['demo', 'file', 'sim']\n      const origin = source.name\n      const self = this\n\n      for (let i = 1; i <= order.length - 1; i += 1) {\n        const cand = order[(order.indexOf(origin) + i) % order.length]\n        source.setMode(cand)\n\n        if (!source.available) {\n          continue\n        }\n        const snap = source.get()\n        if (snap) {\n          // 找到了可用且有数据的数据源\n          this.refresh()\n          prompt.showToast({ message: '数据源已切换为：' + this.srcText, duration: 2000 })\n          return\n        }\n        // 切过去了但还没读到数据：给 file 源一点时间再判一次\n        if (cand === 'file') {\n          prompt.showToast({ message: '正在连接 M1 数据接口…', duration: 1500 })\n          setTimeout(function () {\n            if (source.name !== 'file') {\n              return\n            }\n            if (source.get()) {\n              self.refresh()\n              prompt.showToast({ message: '已连接：' + self.srcText, duration: 2000 })\n            } else {\n              source.setMode(origin)\n              self.refresh()\n              prompt.showToast({\n                message: source.unavailableReason || '数据接口未接通，已回到演示数据',\n                duration: 3000\n              })\n            }\n          }, 2600)\n          return\n        }\n      }\n\n      // 全部不可用：回到原来的数据源\n      source.setMode(origin)\n      this.refresh()\n      prompt.showToast({ message: '仅演示数据可用：' + (source.unavailableReason || ''), duration: 3000 })\n    },\n\n\n    renderTiles() {\n      const tiles = this.appRegistry.map(function (a) {\n        return {\n          name: a.name,\n          sub: a.sub,\n          glyph: a.glyph,\n          uri: a.uri,\n          wrapStyle: 'background-color: ' + a.color\n        }\n      })\n      this.tiles = tiles\n    },\n\n    openApp(e) {\n      const uri = e && e.target && e.target.attr ? e.target.attr.tid : ''\n      if (!uri) {\n        return\n      }\n      router.push({ uri: uri })\n    },\n\n\n    quickStart() {\n      const self = this\n      const snap = source.get()\n      if (!snap) {\n        prompt.showToast({ message: '数据源未连接，无法派单', duration: 2000 })\n        return\n      }\n      const pending = snap.zones.filter(function (z) {\n        return z.status === 'idle' || z.status === 'blocked'\n      })\n      if (pending.length === 0) {\n        prompt.showToast({ message: '四个区域都已执行或已完成，无需派单', duration: 2500 })\n        return\n      }\n      Promise.all(pending.map(function (z) {\n        return Promise.resolve(source.dispatch(z.id))\n      })).then(function (rs) {\n        const ok = rs.filter(function (r) {\n          return r && r.ok\n        }).length\n        const fail = pending.length - ok\n        prompt.showToast({\n          message: '已派发 ' + ok + ' 个任务' + (fail > 0 ? '，' + fail + ' 个失败' : ''),\n          duration: 2500\n        })\n        self.refresh()\n      })\n    },\n\n    quickCancel() {\n      const self = this\n      Promise.resolve(source.cancelAll()).then(function (msg) {\n        prompt.showToast({ message: msg.message, duration: 2000 })\n        self.refresh()\n      })\n    }\n  }\n"},"VoiceAssistant":{"name":"VoiceAssistant","path":"/voice","html":"<div class=\"screen\">\n    <!-- ============ 标题栏 ============ -->\n    <div class=\"topbar\">\n      <div class=\"back\" data-act=\"goBack\">\n        <span class=\"back-text\">返回</span>\n      </div>\n      <span class=\"topbar-title\">语音助手</span>\n      <div class=\"chip\" data-style=\"aiChipStyle\">\n        <span class=\"chip-text\" data-style=\"aiChipTextStyle\"><b data-bind=\"aiStatusText\"></b></span>\n      </div>\n    </div>\n\n    <!-- ============ 会话气泡 ============\n         data-auto-bottom：新消息进来时自动滚到底部。\n         框架层在每次重建后按这个标记决定「继续贴底」还是「保留用户当前位置」，\n         所以往上翻历史时不会被强行拽回底部。\n         id 供页面脚本在追加消息后主动贴底（见 scrollChatToBottom）。 -->\n    <div id=\"chatList\" class=\"chat\" scroll-y=\"true\" data-auto-bottom=\"1\">\n      <div class=\"chat-inner\">\n        <div class=\"bubble-row\" data-each=\"messages\">\n          <div class=\"bubble\" data-style=\"$item.bubbleStyle\">\n            <span class=\"bubble-role\" data-style=\"$item.roleStyle\"><b data-bind=\"$item.role\"></b></span>\n            <span class=\"bubble-text\"><b data-bind=\"$item.text\"></b></span>\n          </div>\n        </div>\n        <div class=\"bubble-row\" data-if=\"thinking\">\n          <div class=\"bubble bubble-ai\">\n            <span class=\"bubble-role role-ai\">助手</span>\n            <span class=\"bubble-text\">正在思考…</span>\n          </div>\n        </div>\n      </div>\n    </div>\n\n    <!-- ============ 预设指令：固定指令识别入口 ============ -->\n    <span class=\"section-title\">常用指令</span>\n    <div class=\"chips\">\n      <div class=\"quick\" data-each=\"quickReplies\" data-tid=\"$item.text\" data-act=\"askQuick\">\n        <span class=\"quick-text\"><b data-bind=\"$item.text\"></b></span>\n      </div>\n    </div>\n\n    <!-- ============ 底部输入区 ============\n         data-touch：在 touchstart 时就触发（而不是等手指抬起合成 click）。\n         这是「按住说话」手感的关键 —— 触屏上 click 发生在抬指瞬间，\n         用户按下去看不到任何反应，会以为没按到。 -->\n    <div class=\"input-bar\">\n      <div class=\"mic\" data-style=\"micStyle\" data-act=\"onMic\" data-touch=\"onMic\">\n        <span class=\"mic-text\"><b data-bind=\"micText\"></b></span>\n      </div>\n      <div class=\"ask\" data-act=\"askCurrent\">\n        <span class=\"ask-text\">发送</span>\n      </div>\n      <span class=\"hint\"><b data-bind=\"hint\"></b></span>\n    </div>\n  </div>","css":"[data-page=\"VoiceAssistant\"] .screen {\n\n    flex-direction: column;\n    width: 100%;\n    height: 100%;\n    padding: 27px 33px 27px 33px;\n    background-color: #0b1220;\n  }\n[data-page=\"VoiceAssistant\"] .topbar {\n\n    flex-direction: row;\n    align-items: center;\n    height: 93px;\n    margin-bottom: 18px;\n  }\n[data-page=\"VoiceAssistant\"] .back {\n\n    justify-content: center;\n    align-items: center;\n    height: 72px;\n    padding: 0px 36px 0px 36px;\n    border-radius: 36px;\n    background-color: #16223a;\n  }\n[data-page=\"VoiceAssistant\"] .back-text {\n\n    font-size: 35px;\n    color: #cbd5e1;\n  }\n[data-page=\"VoiceAssistant\"] .topbar-title {\n\n    flex: 1;\n    font-size: 45px;\n    font-weight: bold;\n    color: #ffffff;\n    margin-left: 27px;\n  }\n[data-page=\"VoiceAssistant\"] .chip {\n\n    padding: 12px 27px 12px 27px;\n    border-radius: 30px;\n  }\n[data-page=\"VoiceAssistant\"] .chip-text {\n\n    font-size: 32px;\n  }\n[data-page=\"VoiceAssistant\"] .chat {\n\n    flex: 1;\n    \n    min-height: 0;\n    width: 100%;\n    border-radius: 33px;\n    background-color: #111c30;\n    \n    touch-action: pan-y;\n    \n    -webkit-overflow-scrolling: touch;\n    \n    overscroll-behavior: contain;\n  }\n[data-page=\"VoiceAssistant\"] .chat-inner {\n\n    flex-direction: column;\n    width: 100%;\n    padding: 27px;\n  }\n[data-page=\"VoiceAssistant\"] .bubble-row {\n\n    flex-direction: row;\n    width: 100%;\n    margin-bottom: 21px;\n  }\n[data-page=\"VoiceAssistant\"] .bubble {\n\n    flex-direction: column;\n    max-width: 1650px;\n    padding: 27px 39px 27px 39px;\n    border-radius: 33px;\n    \n    touch-action: pan-y;\n  }\n[data-page=\"VoiceAssistant\"] .bubble-ai {\n\n    background-color: #1d2a44;\n  }\n[data-page=\"VoiceAssistant\"] .bubble-role {\n\n    font-size: 29px;\n    margin-bottom: 9px;\n  }\n[data-page=\"VoiceAssistant\"] .role-ai {\n\n    color: #4da3ff;\n  }\n[data-page=\"VoiceAssistant\"] .bubble-text {\n\n    font-size: 38px;\n    color: #e2e8f0;\n  }\n[data-page=\"VoiceAssistant\"] .section-title {\n\n    font-size: 29px;\n    color: #7d8ea8;\n    margin-top: 12px;\n    margin-bottom: 8px;\n    \n    flex-shrink: 0;\n  }\n[data-page=\"VoiceAssistant\"] .chips {\n\n    flex-direction: row;\n    flex-wrap: wrap;\n    width: 100%;\n    flex-shrink: 0;\n  }\n[data-page=\"VoiceAssistant\"] .quick {\n\n    justify-content: center;\n    align-items: center;\n    height: 68px;\n    padding: 0px 28px 0px 28px;\n    margin: 0px 14px 12px 0px;\n    border-radius: 34px;\n    background-color: #1d2a44;\n  }\n[data-page=\"VoiceAssistant\"] .quick-text {\n\n    font-size: 30px;\n    color: #a9c1e0;\n  }\n[data-page=\"VoiceAssistant\"] .input-bar {\n\n    flex-direction: row;\n    align-items: center;\n    width: 100%;\n    height: 96px;\n    margin-top: 6px;\n    flex-shrink: 0;\n  }\n[data-page=\"VoiceAssistant\"] .mic {\n\n    justify-content: center;\n    align-items: center;\n    width: 290px;\n    height: 84px;\n    border-radius: 42px;\n  }\n[data-page=\"VoiceAssistant\"] .mic-text {\n\n    font-size: 39px;\n    font-weight: bold;\n    color: #ffffff;\n  }\n[data-page=\"VoiceAssistant\"] .ask {\n\n    justify-content: center;\n    align-items: center;\n    width: 185px;\n    height: 84px;\n    margin-left: 18px;\n    border-radius: 42px;\n    background-color: #2f6df6;\n  }\n[data-page=\"VoiceAssistant\"] .ask-text {\n\n    font-size: 39px;\n    font-weight: bold;\n    color: #ffffff;\n  }\n[data-page=\"VoiceAssistant\"] .hint {\n\n    flex: 1;\n    font-size: 30px;\n    color: #64748b;\n    text-align: right;\n  }","script":"\n\n\n\n  const SPEECH_URL = 'http://127.0.0.1:8124'\n\n\n  function playBeep(kind) {\n    try {\n      fetch(SPEECH_URL + '/api/beep', {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify({ kind: kind || 'ready' })\n      }).catch(function () {})\n    } catch (e) {\n      // 忽略：没有语音服务时仍然可以走文本指令\n    }\n  }\n\n\n  function voiceState() {\n    return fetch(SPEECH_URL + '/api/voice/state')\n      .then(function (r) { return r.json() })\n      .catch(function () { return { ok: false, state: null } })\n  }\n\n\n\n\n\n\n\n\n\n\n\n  function voiceRecords(since) {\n    return fetch(SPEECH_URL + '/api/voice/records?since=' + (since || 0))\n      .then(function (r) { return r.json() })\n      .catch(function () { return { ok: false, records: [] } })\n  }\n\n\n\n\n\n\n  function voiceTalk() {\n    return fetch(SPEECH_URL + '/api/voice/talk', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ wait: 45 })\n    }).then(function (r) {\n      return r.json()\n    }).catch(function () {\n      return { ok: false, stage: 'no-service',\n               reason: '语音服务未启动（请运行 linux/speech-bridge.py）' }\n    })\n  }\n\n\n\n\n\n\n\n\n  function voiceStart() {\n    return fetch(SPEECH_URL + '/api/voice/start', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({})\n    }).then(function (r) {\n      if (r.status === 404) {\n        // 桥是老版本：退回一次性接口，功能仍然可用（只是第二次按下不生效）\n        return voiceTalk()\n      }\n      return r.json()\n    }).catch(function () {\n      return { ok: false, stage: 'no-service',\n               reason: '语音服务未启动（请运行 linux/speech-bridge.py）' }\n    })\n  }\n\n\n\n\n\n\n\n\n\n\n\n\n  function voiceStop() {\n    return fetch(SPEECH_URL + '/api/voice/stop', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ wait: 2 })\n    }).then(function (r) {\n      return r.json()\n    }).catch(function () {\n      return { ok: false, stage: 'no-service',\n               reason: '语音服务未启动（请运行 linux/speech-bridge.py）' }\n    })\n  }\n\n\n  function recordSpeech(seconds) {\n    return fetch(SPEECH_URL + '/api/record', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ seconds: seconds || 4 })\n    }).then(function (r) {\n      return r.json()\n    }).catch(function () {\n      return { ok: false, silent: true, reason: '语音服务未启动（请运行 linux/speech-bridge.py）' }\n    })\n  }\n\n  return {\n    private: {\n      aiReady: false,\n      aiStatusText: '本地指令模式',\n      aiChipStyle: 'background-color: rgba(251, 191, 36, 0.16)',\n      aiChipTextStyle: 'color: #fbbf24',\n      thinking: false,\n      // 「正在听 / 正在识别」的模态：这期间按键不再接受新的按压\n      listening: false,\n      busy: false,\n      micText: '说话',\n      micStyle: 'background-color: #0EA5A4',\n      hint: '按一下「说话」开始，说完再按一下结束',\n      messages: [],\n      quickReplies: [\n        { text: '开始本轮巡检' },\n        { text: '现在哪些区域没查完' },\n        { text: '展项区为什么阻塞' },\n        { text: '取消全部未完成任务' },\n        { text: '生成巡检报告' }\n      ],\n      // 当前将要发出的问题（由预设指令选择或语音识别结果决定）\n      current: '',\n      // 语音服务能力：micOk=false 表示本机麦克风采不到声音（硬件层限制）\n      speechReady: false,\n      micOk: false,\n      speechNote: '',\n\n\n\n\n\n\n      chatPinned: true,\n      // 设备对话记录的轮询游标（已看到的最后一条序号）\n      lastSeq: 0,\n      // 已经渲染过的记录键，避免「阻塞返回」与「轮询」把同一条显示两遍\n      seenRecords: {},\n      // 轮询是否已停（页面销毁后不再拉）\n      pollStopped: false\n    },\n\n    onInit() {\n      this.messages = [\n        {\n          role: '助手',\n          text: '我是 VelaGuard 语音助手。按一下「说话」开始，说完再按一下「结束」；' +\n                '也可以直接喊「Hello, openvela」，或点下面的常用指令。',\n          bubbleStyle: 'background-color: #1d2a44',\n          roleStyle: 'color: #4da3ff'\n        }\n      ]\n      this.probeAI()\n      // 先把游标对到「当前最新」，避免一进页面就把历史对话全灌进来\n      this.primeRecords()\n    },\n\n    onShow() {\n      this.scrollChatToBottom()\n      this.watchChatScroll()\n      this.startPolling()\n    },\n\n    onHide() {\n      this.stopPolling()\n    },\n\n    onDestroy() {\n      this.stopPolling()\n    },\n\n\n    primeRecords() {\n      const self = this\n      voiceRecords(0).then(function (r) {\n        if (r && r.ok) {\n          self.lastSeq = r.lastSeq || 0\n        }\n      })\n    },\n\n\n\n\n\n\n\n\n\n\n\n\n\n    startPolling() {\n      const self = this\n      if (this._pollTimer) {\n        return\n      }\n      this.pollStopped = false\n      this._pollTimer = setInterval(function () {\n        if (self.pollStopped) {\n          return\n        }\n        voiceRecords(self.lastSeq).then(function (r) {\n          if (!r || !r.ok) {\n            return\n          }\n          const list = r.records || []\n          let added = 0\n          list.forEach(function (rec) {\n            if (rec.seq > self.lastSeq) {\n              self.lastSeq = rec.seq\n            }\n            if (self.renderRecord(rec)) {\n              added += 1\n            }\n          })\n          if (added > 0) {\n            // 有新对话就贴底（历史翻看状态由 scrollChatToBottom 自己判断）\n            self.scrollChatToBottom()\n          }\n        })\n      }, 1000)\n    },\n\n    stopPolling() {\n      this.pollStopped = true\n      if (this._pollTimer) {\n        clearInterval(this._pollTimer)\n        this._pollTimer = null\n      }\n    },\n\n\n\n\n\n\n\n    renderRecord(rec) {\n      if (!rec) {\n        return false\n      }\n      const key = rec.seq ? ('s' + rec.seq) : ((rec.ts || '') + '|' + (rec.text || ''))\n      if (this.seenRecords[key]) {\n        return false\n      }\n      this.seenRecords[key] = true\n\n      const text = String(rec.text || '').trim()\n      const reply = String(rec.said || '').trim() || this.describeRecord(rec)\n      if (!text && !reply) {\n        return false\n      }\n      if (text) {\n        this.pushMessage('你', text, false)\n      }\n      if (reply) {\n        this.pushMessage('助手', reply, true)\n      }\n      return true\n    },\n\n\n\n\n\n\n\n\n\n    describeRecord(rec) {\n      const errMap = {\n        net: '网络不通', asr: '识别失败', asr_to: '识别超时',\n        nohear: '没听清', nomatch: '没听懂', unsafe: '这条指令不安全',\n        noaction: '这条指令还没配置', execfail: '执行失败',\n        vcmderr: '命令解析出错', micbusy: '麦克风被占用',\n        recfail: '录音失败', nomic: '没听到声音', nocar: '小车联系不上'\n      }\n      if (rec.error && errMap[rec.error]) {\n        return errMap[rec.error]\n      }\n      const intentMap = {\n        forward: '前进', backward: '后退', turn_left: '左转', turn_right: '右转',\n        strafe_left: '向左平移', strafe_right: '向右平移', stop: '急停',\n        reset: '复位', start_formation: '编队实验', status: '查询状态',\n        car_check: '查询小车连接', battery: '查询电量', confirm: '已确认'\n      }\n      if (rec.intent && intentMap[rec.intent]) {\n        return '已执行：' + intentMap[rec.intent]\n      }\n      if (rec.error) {\n        return '出错了（' + rec.error + '）'\n      }\n      return ''\n    },\n\n\n\n\n\n    watchChatScroll() {\n      const self = this\n      if (this._chatWatched) {\n        return\n      }\n      const el = (function () {\n        try {\n          return document.getElementById('chatList')\n        } catch (e) {\n          return null\n        }\n      })()\n      if (!el || typeof el.addEventListener !== 'function') {\n        return\n      }\n      this._chatWatched = true\n      el.addEventListener('scroll', function () {\n        const gap = el.scrollHeight - el.scrollTop - el.clientHeight\n        self.chatPinned = gap < 40\n      })\n    },\n\n\n\n\n\n\n\n\n\n\n\n    probeAI() {\n      const self = this\n\n      // 先探本地离线语音服务（本设备上真正可用的那条）\n      fetch(SPEECH_URL + '/api/health').then(function (r) {\n        return r.json()\n      }).then(function (h) {\n        self.speechReady = !!(h && h.ok && h.model)\n        if (self.speechReady) {\n          self.speechNote = h.engine || 'vosk 离线'\n          self.hint = '按一下「说话」开始，说完再按一下「结束」'\n        }\n      }).catch(function () {\n        self.speechReady = false\n        self.hint = '本地指令可用，巡检数据来自 ' + self.sourceName()\n      })\n\n      // 再看端侧 AI（本设备一般不可用，拿到就升级）\n      let mod = null\n      try {\n        mod = velaclaw\n      } catch (e) {\n        mod = null\n      }\n      if (!mod || typeof mod.ask !== 'function') {\n        this.aiReady = false\n        this.aiStatusText = '本地指令模式'\n        return\n      }\n      try {\n        mod.ask({\n          query: 'ping',\n          success() {\n            self.aiReady = true\n            self.aiStatusText = '端侧 AI 已就绪'\n            self.aiChipStyle = 'background-color: rgba(61, 220, 132, 0.16)'\n            self.aiChipTextStyle = 'color: #3ddc84'\n            self.hint = '已连接端侧 AI'\n          },\n          fail(data, code) {\n            self.aiReady = false\n            self.aiStatusText = '本地指令模式'\n          }\n        })\n      } catch (err) {\n        this.aiReady = false\n        this.aiStatusText = '本地指令模式'\n      }\n    },\n\n    sourceName() {\n      const snap = source.get()\n      return snap ? snap.sourceText : '未连接'\n    },\n\n    askQuick(e) {\n      const text = e && e.target && e.target.attr ? e.target.attr.tid : ''\n      if (!text) {\n        return\n      }\n      this.current = text\n      this.ask(text)\n    },\n\n    askCurrent() {\n      if (!this.current) {\n        this.pushMessage('你', '请先点一条常用指令，或点「说话」', false)\n        return\n      }\n      this.ask(this.current)\n    },\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n    onMic() {\n      const self = this\n\n      // 已经在识别/播报中：忽略，避免用户连点把状态搞乱\n      if (this.busy) {\n        return\n      }\n\n      // ---------- 第二次按：立即结束录音 ----------\n      if (this.listening) {\n        this.listening = false\n        this.busy = true\n        this.micText = '识别中'\n        this.micStyle = 'background-color: #64748b'\n        this.hint = '正在识别…'\n        playBeep('stop')          // 下行音 = 结束\n        voiceStop().then(function (res) {\n          self.finishTalk(res)\n        })\n        return\n      }\n\n      // ---------- 第一次按：提示音 + 立即开始录音 ----------\n      this.busy = true\n      this.hint = '正在启动…'\n      playBeep('listen')          // 上行音 = 开始\n      voiceState().then(function (st) {\n        const s = st && st.state\n        if (!s || !s.assistant) {\n          return { ok: false, stage: 'no-service',\n                   reason: '设备语音服务未运行' }\n        }\n        return voiceStart()\n      }).then(function (res) {\n        if (!res || !res.ok) {\n          // 起不来就如实说，不要留在「正在听」的假状态里\n          self.busy = false\n          self.listening = false\n          self.micText = '说话'\n          self.micStyle = 'background-color: #0EA5A4'\n          self.hint = (res && res.reason) || '语音服务不可用'\n          self.pushMessage('助手',\n            '没能开始录音：' + ((res && res.reason) || '未知原因') +\n            '。可以先点下面的常用指令。', true)\n          return\n        }\n\n\n\n\n        if (res.stage === 'done') {\n          self.finishTalk(res)\n          return\n        }\n        self.busy = false\n        self.listening = true\n        self.micText = '结束'\n        self.micStyle = 'background-color: #F59E0B'\n        self.hint = '正在听…说完再按一下「结束」'\n      })\n    },\n\n\n    finishTalk(res) {\n      this.busy = false\n      this.listening = false\n      this.micText = '说话'\n      this.micStyle = 'background-color: #0EA5A4'\n\n      if (!res) {\n        this.hint = '没有拿到结果'\n        return\n      }\n\n\n\n\n\n\n      if (res.ok && res.stage === 'recognizing') {\n        this.hint = '录音已结束，正在识别…（云端较慢，结果会自动显示）'\n        return\n      }\n\n      if (!res.ok) {\n        this.hint = res.reason || '语音交互失败'\n        this.pushMessage('助手', '没成功：' + (res.reason || '未知原因'), true)\n        return\n      }\n\n      // 已经把结果带回来了：走和轮询同一条渲染路径（按 seq/ts 去重，不会重复显示）\n      const shown = this.renderRecord({\n        seq: res.seq,\n        ts: res.ts,\n        text: res.text,\n        said: res.said,\n        error: res.error,\n        intent: res.intent\n      })\n      if (shown) {\n        this.hint = res.stopMode === 'vad-auto' ? '完成（说完自动结束的）' : '完成'\n        return\n      }\n      if (res.text || res.said) {\n        this.hint = '完成'\n        return\n      }\n      this.hint = '设备没识别到内容，结果出来会自动显示'\n    },\n\n\n    ask(query) {\n      this.pushMessage('你', query, false)\n      const self = this\n      // 本地可闭环的指令优先本地执行，避免依赖大模型可用性\n      const local = this.tryLocal(query)\n      if (local) {\n        this.pushMessage('助手', local, true)\n        return\n      }\n      if (!this.aiReady) {\n\n\n\n\n        this.pushMessage('助手',\n          '这句我答不上来。当前可用的是「常用指令」里的巡检类问题，' +\n          '它们直接读本地巡检数据，不依赖大模型。', true)\n        return\n      }\n      this.thinking = true\n      velaclaw.ask({\n        query: query,\n        success(res) {\n          self.thinking = false\n          self.pushMessage('助手', res && res.reply ? res.reply : '（未返回内容）', true)\n        },\n        fail(data, code) {\n          self.thinking = false\n          self.pushMessage('助手', '调用端侧 AI 失败，错误码 ' + code, true)\n        }\n      })\n    },\n\n\n\n\n\n    tryLocal(query) {\n      const snap = source.get()\n      if (!snap) {\n        return '数据源未连接，请先确认 M1 侧是否在写 data/state.json。'\n      }\n      if (query.indexOf('开始') >= 0 && query.indexOf('巡检') >= 0) {\n        const idle = snap.zones.filter(function (z) {\n          return z.status === 'idle' || z.status === 'blocked'\n        })\n        if (idle.length === 0) {\n          return '当前没有待派发的区域，四个区域都已执行或已完成。'\n        }\n        let ok = 0\n        idle.forEach(function (z) {\n          const r = store.dispatchTask(z.id)\n          if (r.ok) {\n            ok += 1\n          }\n        })\n        return '已向 ' + ok + ' 个区域下发任务单：' + idle.map(function (z) {\n          return z.name\n        }).join('、') + '。'\n      }\n      if (query.indexOf('取消') >= 0) {\n        return store.cancelAll().message\n      }\n      if (query.indexOf('没查完') >= 0 || query.indexOf('进度') >= 0 || query.indexOf('哪些区域') >= 0) {\n        const pending = snap.zones.filter(function (z) {\n          return z.status !== 'done'\n        })\n        if (pending.length === 0) {\n          return '四个区域都已查完，本轮巡检无未完成项。'\n        }\n        return '尚未完成的区域有 ' + pending.length + ' 个：' + pending.map(function (z) {\n          return z.name + '（' + z.statusText + '）'\n        }).join('、') + '。需要现在重新派发吗？'\n      }\n      if (query.indexOf('阻塞') >= 0 || query.indexOf('为什么') >= 0) {\n        const blocked = snap.zones.filter(function (z) {\n          return z.status === 'blocked'\n        })\n        if (blocked.length === 0) {\n          return '当前没有阻塞区域。'\n        }\n        return blocked.map(function (z) {\n          return z.name + '：' + z.detail + '（车辆 ' + z.car + '，已完成 ' + z.progress + '%）'\n        }).join('；')\n      }\n      if (query.indexOf('数据') >= 0 || query.indexOf('来源') >= 0 || query.indexOf('连接') >= 0) {\n        return '当前数据源为「' + snap.sourceText + '」' +\n          (snap.connected ? '，链路正常。' : '，链路已断开。') +\n          '更新于 ' + snap.lastUpdateText + '。'\n      }\n      if (query.indexOf('报告') >= 0 || query.indexOf('汇总') >= 0) {\n        const s = snap.summary\n        return '本轮巡检共 ' + s.total + ' 个区域：已完成 ' + s.counts.done +\n          '、进行中 ' + s.counts.running + '、阻塞 ' + s.counts.blocked +\n          '、未开始 ' + s.counts.idle + '、离线 ' + s.counts.offline + '。'\n      }\n      return ''\n    },\n\n    pushMessage(role, text, isAI) {\n      const isUser = !isAI\n      const item = {\n        role: role,\n        text: text,\n        bubbleStyle: isUser\n          ? 'background-color: #2f6df6; align-self: flex-end'\n          : 'background-color: #1d2a44',\n        roleStyle: isUser ? 'color: #cfe0ff' : 'color: #4da3ff'\n      }\n      const list = this.messages.slice()\n      list.push(item)\n      this.messages = list\n      this.scrollChatToBottom()\n    },\n\n\n\n\n\n\n\n\n\n\n\n\n\n    scrollChatToBottom() {\n      const self = this\n      const run = function () {\n        let el = null\n        try {\n          el = document.getElementById('chatList')\n        } catch (e) {\n          el = null\n        }\n        if (!el) {\n          return\n        }\n        // 用户正在翻历史：不打扰\n        if (el.scrollHeight > el.clientHeight + 4) {\n          const gap = el.scrollHeight - el.scrollTop - el.clientHeight\n          if (gap > 40 && self.chatPinned === false) {\n            return\n          }\n          self.chatPinned = true\n        }\n        if (typeof el.scrollTo === 'function') {\n          try {\n            el.scrollTo({ top: el.scrollHeight, behavior: 'auto' })\n          } catch (e) {\n            el.scrollTop = el.scrollHeight\n          }\n        } else {\n          el.scrollTop = el.scrollHeight\n        }\n      }\n      // 等这一帧渲染完成再滚，否则拿到的 scrollHeight 还是旧的\n      if (typeof requestAnimationFrame === 'function') {\n        requestAnimationFrame(run)\n      } else {\n        run()\n      }\n    },\n\n    goBack() {\n      router.back()\n    }\n  }\n"},"Dispatch":{"name":"Dispatch","path":"/dispatch","html":"<div class=\"screen\">\n    <!-- ============ 标题栏 ============ -->\n    <div class=\"topbar\">\n      <div class=\"back\" data-act=\"goBack\">\n        <span class=\"back-text\">返回</span>\n      </div>\n      <span class=\"topbar-title\">巡检调度台</span>\n      <div class=\"chip\">\n        <span class=\"chip-text\"><b data-bind=\"headline\"></b></span>\n      </div>\n    </div>\n\n    <div class=\"body\">\n      <!-- ============ 左：4 台车辆的状态卡 ============ -->\n      <div class=\"left\">\n        <span class=\"section-title\">车辆与区域</span>\n        <div class=\"cars\">\n          <div class=\"car\" data-each=\"cars\">\n            <div class=\"car-head\">\n              <span class=\"car-id\"><b data-bind=\"$item.id\"></b></span>\n              <div class=\"dot\" data-style=\"$item.dotStyle\"></div>\n              <span class=\"car-link\" data-style=\"$item.linkStyle\"><b data-bind=\"$item.link\"></b></span>\n            </div>\n            <span class=\"car-zone\"><b data-bind=\"$item.zone\"></b> · <b data-bind=\"$item.ip\"></b></span>\n            <span class=\"car-meta\">电量 <b data-bind=\"$item.batteryText\"></b></span>\n          </div>\n        </div>\n\n        <div class=\"note\">\n          <span class=\"note-title\">异常闭环提示</span>\n          <span class=\"note-text\"><b data-bind=\"alertText\"></b></span>\n        </div>\n      </div>\n\n      <!-- ============ 右：任务清单与操作 ============ -->\n      <div class=\"right\">\n        <span class=\"section-title\">本轮任务清单</span>\n        <div class=\"tasks\">\n          <div class=\"task\" data-each=\"zones\">\n            <div class=\"task-line\">\n              <span class=\"task-zone\"><b data-bind=\"$item.name\"></b></span>\n              <div class=\"badge\" data-style=\"$item.badgeStyle\">\n                <span class=\"badge-text\" data-style=\"$item.badgeTextStyle\"><b data-bind=\"$item.statusText\"></b></span>\n              </div>\n            </div>\n            <span class=\"task-detail\"><b data-bind=\"$item.detail\"></b></span>\n            <div class=\"task-foot\">\n              <span class=\"task-route\"><b data-bind=\"$item.route\"></b> · <b data-bind=\"$item.car\"></b></span>\n              <span class=\"task-progress\">进度 <b data-bind=\"$item.progress\"></b>%</span>\n            </div>\n            <div class=\"actions\">\n              <div class=\"btn btn-primary\" data-tid=\"$item.id\" data-act=\"onDispatch\">\n                <span class=\"btn-text-primary\">派单</span>\n              </div>\n              <div class=\"btn\" data-tid=\"$item.id\" data-act=\"onCancel\">\n                <span class=\"btn-text\">取消</span>\n              </div>\n            </div>\n          </div>\n        </div>\n      </div>\n    </div>\n\n    <!-- ============ 底部批量操作 ============ -->\n    <div class=\"footer\">\n      <div class=\"dock-btn dock-primary\" data-act=\"onStartAll\">\n        <span class=\"dock-text-primary\">开始本轮巡检</span>\n      </div>\n      <div class=\"dock-btn\" data-act=\"onCancelAll\">\n        <span class=\"dock-text\">一键取消全部</span>\n      </div>\n      <span class=\"footer-hint\">派单报文：任务序号 / 目标车辆 / 区域路线编号 / 取消标记</span>\n    </div>\n  </div>","css":"[data-page=\"Dispatch\"] .screen {\n\n    flex-direction: column;\n    width: 100%;\n    height: 100%;\n    padding: 18px 22px 18px 22px;\n    background-color: #0b1220;\n  }\n[data-page=\"Dispatch\"] .topbar {\n\n    flex-direction: row;\n    align-items: center;\n    height: 62px;\n    margin-bottom: 12px;\n  }\n[data-page=\"Dispatch\"] .back {\n\n    justify-content: center;\n    align-items: center;\n    height: 48px;\n    padding: 0px 24px 0px 24px;\n    border-radius: 24px;\n    background-color: #16223a;\n  }\n[data-page=\"Dispatch\"] .back-text {\n\n    font-size: 23px;\n    color: #cbd5e1;\n  }\n[data-page=\"Dispatch\"] .topbar-title {\n\n    flex: 1;\n    font-size: 30px;\n    font-weight: bold;\n    color: #ffffff;\n    margin-left: 18px;\n  }\n[data-page=\"Dispatch\"] .chip {\n\n    padding: 8px 18px 8px 18px;\n    border-radius: 20px;\n    background-color: #1d2a44;\n  }\n[data-page=\"Dispatch\"] .chip-text {\n\n    font-size: 21px;\n    color: #a9c1e0;\n  }\n[data-page=\"Dispatch\"] .body {\n\n    flex: 1;\n    flex-direction: row;\n    width: 100%;\n  }\n[data-page=\"Dispatch\"] .left {\n\n    flex-direction: column;\n    width: 480px;\n    margin-right: 24px;\n  }\n[data-page=\"Dispatch\"] .section-title {\n\n    font-size: 26px;\n    color: #7d8ea8;\n    margin-bottom: 12px;\n  }\n[data-page=\"Dispatch\"] .cars {\n\n    flex-direction: column;\n    width: 100%;\n  }\n[data-page=\"Dispatch\"] .car {\n\n    flex-direction: column;\n    width: 100%;\n    padding: 14px 18px 14px 18px;\n    margin-bottom: 12px;\n    border-radius: 20px;\n    background-color: #16223a;\n  }\n[data-page=\"Dispatch\"] .car-head {\n\n    flex-direction: row;\n    align-items: center;\n  }\n[data-page=\"Dispatch\"] .car-id {\n\n    font-size: 25px;\n    font-weight: bold;\n    color: #e2e8f0;\n  }\n[data-page=\"Dispatch\"] .dot {\n\n    width: 14px;\n    height: 14px;\n    border-radius: 7px;\n    margin-left: 12px;\n  }\n[data-page=\"Dispatch\"] .car-link {\n\n    font-size: 20px;\n    margin-left: 8px;\n  }\n[data-page=\"Dispatch\"] .car-zone {\n\n    font-size: 21px;\n    color: #8fa3bf;\n    margin-top: 6px;\n  }\n[data-page=\"Dispatch\"] .car-meta {\n\n    font-size: 20px;\n    color: #64748b;\n    margin-top: 4px;\n  }\n[data-page=\"Dispatch\"] .note {\n\n    flex-direction: column;\n    width: 100%;\n    padding: 16px 18px 16px 18px;\n    border-radius: 20px;\n    background-color: rgba(255, 107, 107, 0.12);\n  }\n[data-page=\"Dispatch\"] .note-title {\n\n    font-size: 22px;\n    font-weight: bold;\n    color: #ff9b9b;\n  }\n[data-page=\"Dispatch\"] .note-text {\n\n    font-size: 21px;\n    color: #d9a2a2;\n    margin-top: 6px;\n  }\n[data-page=\"Dispatch\"] .right {\n\n    flex: 1;\n    flex-direction: column;\n  }\n[data-page=\"Dispatch\"] .tasks {\n\n    flex-direction: row;\n    flex-wrap: wrap;\n    width: 100%;\n  }\n[data-page=\"Dispatch\"] .task {\n\n    flex-direction: column;\n    width: 640px;\n    padding: 20px 22px 18px 22px;\n    margin: 0px 20px 18px 0px;\n    border-radius: 26px;\n    background-color: #16223a;\n  }\n[data-page=\"Dispatch\"] .task-line {\n\n    flex-direction: row;\n    align-items: center;\n    justify-content: space-between;\n  }\n[data-page=\"Dispatch\"] .task-zone {\n\n    font-size: 27px;\n    font-weight: bold;\n    color: #e2e8f0;\n  }\n[data-page=\"Dispatch\"] .badge {\n\n    padding: 5px 14px 5px 14px;\n    border-radius: 16px;\n  }\n[data-page=\"Dispatch\"] .badge-text {\n\n    font-size: 20px;\n  }\n[data-page=\"Dispatch\"] .task-detail {\n\n    font-size: 21px;\n    color: #8fa3bf;\n    margin-top: 8px;\n  }\n[data-page=\"Dispatch\"] .task-foot {\n\n    flex-direction: row;\n    justify-content: space-between;\n    margin-top: 8px;\n  }\n[data-page=\"Dispatch\"] .task-route {\n\n    font-size: 20px;\n    color: #64748b;\n  }\n[data-page=\"Dispatch\"] .task-progress {\n\n    font-size: 20px;\n    color: #64748b;\n  }\n[data-page=\"Dispatch\"] .actions {\n\n    flex-direction: row;\n    margin-top: 12px;\n  }\n[data-page=\"Dispatch\"] .btn {\n\n    justify-content: center;\n    align-items: center;\n    height: 48px;\n    padding: 0px 26px 0px 26px;\n    margin-right: 12px;\n    border-radius: 24px;\n    background-color: #23324f;\n  }\n[data-page=\"Dispatch\"] .btn-primary {\n\n    background-color: #2f6df6;\n  }\n[data-page=\"Dispatch\"] .btn-text {\n\n    font-size: 22px;\n    color: #cbd5e1;\n  }\n[data-page=\"Dispatch\"] .btn-text-primary {\n\n    font-size: 22px;\n    font-weight: bold;\n    color: #ffffff;\n  }\n[data-page=\"Dispatch\"] .footer {\n\n    flex-direction: row;\n    align-items: center;\n    width: 100%;\n    height: 76px;\n    padding: 0px 20px 0px 20px;\n    border-radius: 24px;\n    background-color: #16223a;\n  }\n[data-page=\"Dispatch\"] .dock-btn {\n\n    justify-content: center;\n    align-items: center;\n    height: 52px;\n    padding: 0px 26px 0px 26px;\n    margin-right: 14px;\n    border-radius: 26px;\n    background-color: #23324f;\n  }\n[data-page=\"Dispatch\"] .dock-primary {\n\n    background-color: #2f6df6;\n  }\n[data-page=\"Dispatch\"] .dock-text {\n\n    font-size: 23px;\n    color: #cbd5e1;\n  }\n[data-page=\"Dispatch\"] .dock-text-primary {\n\n    font-size: 23px;\n    font-weight: bold;\n    color: #ffffff;\n  }\n[data-page=\"Dispatch\"] .footer-hint {\n\n    flex: 1;\n    font-size: 19px;\n    color: #64748b;\n    text-align: right;\n  }","script":"\n\n\n\n  return {\n    private: {\n      headline: '—',\n      alertText: '—',\n      cars: [],\n      zones: []\n    },\n\n    onInit() {\n      this.refresh()\n      const self = this\n      source.onUpdate(function () {\n        self.refresh()\n      })\n    },\n\n    onShow() {\n      this.refresh()\n    },\n\n    onRefresh() {\n      this.refresh()\n    },\n\n    refresh() {\n      const snap = source.get()\n      if (!snap) {\n        this.headline = '正在连接数据源…'\n        return\n      }\n\n      const cars = snap.cars.map(function (c) {\n        return Object.assign({}, c, {\n          dotStyle: 'background-color: ' + (c.online ? '#3ddc84' : '#fbbf24'),\n          linkStyle: 'color: ' + (c.online ? '#3ddc84' : '#fbbf24'),\n          batteryText: c.online ? c.battery + '%' : '—'\n        })\n      })\n      this.cars = cars\n\n      const zones = snap.zones.map(function (z) {\n        const st = store.statusOf(z.status)\n        return Object.assign({}, z, {\n          badgeStyle: 'background-color: ' + st.bg,\n          badgeTextStyle: 'color: ' + st.color\n        })\n      })\n      this.zones = zones\n\n      const s = snap.summary\n      this.headline = '已完成 ' + s.counts.done + ' / ' + s.total +\n        ' · 阻塞 ' + s.counts.blocked + ' · 离线 ' + s.counts.offline\n\n      const blocked = zones.filter(function (z) {\n        return z.status === 'blocked'\n      })\n      if (blocked.length > 0) {\n        this.alertText = blocked[0].name + '：' + blocked[0].detail +\n          '。可按「一键取消全部」撤下未完成任务后重派。'\n      } else {\n        this.alertText = '当前没有待处理异常。'\n      }\n    },\n\n    zoneIdOf(e) {\n      return e && e.target && e.target.attr ? e.target.attr.tid : ''\n    },\n\n\n    handle(result) {\n      const self = this\n      Promise.resolve(result).then(function (r) {\n        prompt.showToast({ message: r && r.message ? r.message : '已下发', duration: 2000 })\n        self.refresh()\n      })\n    },\n\n    onDispatch(e) {\n      const id = this.zoneIdOf(e)\n      this.handle(source.dispatch(id))\n    },\n\n    onCancel(e) {\n      const id = this.zoneIdOf(e)\n      this.handle(source.cancel(id))\n    },\n\n    onStartAll() {\n      const zones = this.zones.filter(function (z) {\n        return z.status === 'idle' || z.status === 'blocked'\n      })\n      const self = this\n      if (zones.length === 0) {\n        prompt.showToast({ message: '没有待派发的任务', duration: 2000 })\n        return\n      }\n      Promise.all(zones.map(function (z) {\n        return Promise.resolve(source.dispatch(z.id))\n      })).then(function (rs) {\n        const ok = rs.filter(function (r) {\n          return r && r.ok\n        }).length\n        prompt.showToast({\n          message: '已派发 ' + ok + ' / ' + zones.length + ' 个任务',\n          duration: 2500\n        })\n        self.refresh()\n      })\n    },\n\n    onCancelAll() {\n      this.handle(source.cancelAll())\n    },\n\n    goBack() {\n      router.back()\n    }\n  }\n"},"Zones":{"name":"Zones","path":"/zones","html":"<div class=\"screen\">\n    <div class=\"topbar\">\n      <div class=\"back\" data-act=\"goBack\">\n        <span class=\"back-text\">返回</span>\n      </div>\n      <span class=\"topbar-title\">区域与路线</span>\n      <div class=\"chip\">\n        <span class=\"chip-text\"><b data-bind=\"zones.length\"></b> 个区域 · 固定路线</span>\n      </div>\n    </div>\n\n    <span class=\"section-title\">首期只做「固定区域 + 固定路线」，保证车端可复现</span>\n\n    <div class=\"grid\">\n      <div class=\"card\" data-each=\"zones\">\n        <div class=\"card-head\">\n          <div class=\"zone-tag\" data-style=\"$item.tagStyle\">\n            <span class=\"zone-tag-text\"><b data-bind=\"$item.id\"></b></span>\n          </div>\n          <span class=\"zone-name\"><b data-bind=\"$item.name\"></b></span>\n        </div>\n\n        <div class=\"row\">\n          <span class=\"row-label\">路线编号</span>\n          <span class=\"row-value\"><b data-bind=\"$item.route\"></b></span>\n        </div>\n        <div class=\"row\">\n          <span class=\"row-label\">动作序列</span>\n          <span class=\"row-value\"><b data-bind=\"$item.routeDesc\"></b></span>\n        </div>\n        <div class=\"row\">\n          <span class=\"row-label\">责任车辆</span>\n          <span class=\"row-value\"><b data-bin /* ---------------- 渲染引擎 ---------------- */
const nodeData = new WeakMap()

function el(tag, attrs, children) {
  const n = { tag: tag, attrs: attrs || {}, children: children || [] }
  return n
}

/** 解析运行期标记串为节点树 */
function parse(html) {
  const doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html')
  return convert(doc.body.firstElementChild)
}

function convert(dom, depth) {
  if (!dom) {
    return { text: '' }
  }
  // 只处理元素节点与文本节点；注释（nodeType 8）、文档类型等一律跳过。
  // 模板里的 <!-- --> 说明注释会以 nodeType 8 出现，早期版本未过滤会导致
  // 读取 attributes 报 TypeError，这里显式放行。
  if (dom.nodeType !== 1) {
    if (dom.nodeType === 3) {
      return { text: dom.textContent }
    }
    return { text: '' }
  }

  // 用 getAttributeNames/getAttribute 读取属性：比 attributes 集合更稳，
  // 也避免在不同宿主环境下遇到 attributes 缺失导致的 TypeError。
  const attrs = {}
  const names = typeof dom.getAttributeNames === 'function' ? dom.getAttributeNames() : []
  for (let i = 0; i < names.length; i += 1) {
    attrs[names[i]] = dom.getAttribute(names[i])
  }

  const kids = dom.childNodes || []
  const children = []
  for (let i = 0; i < kids.length; i += 1) {
    children.push(convert(kids[i], (depth || 0) + 1))
  }

  return {
    tag: String(dom.tagName || 'div').toLowerCase(),
    attrs: attrs,
    children: children
  }
}

/** 取属性上的绑定值：data-bind / data-if / data-style / data-class 里是数据路径 */
function pickByPath(data, expr) {
  const parts = String(expr).trim().split('.')
  let cur = data
  for (let i = 0; i < parts.length; i += 1) {
    if (cur === null || cur === undefined) {
      return undefined
    }
    cur = cur[parts[i]]
  }
  return cur
}

function resolvePath(path, scope) {
  if (scope && Object.prototype.hasOwnProperty.call(scope, path)) {
    return scope[path]
  }
  if (path.indexOf('$item') === 0) {
    const rest = path.slice(5).replace(/^\./, '')
    return rest ? pickByPath(scope.$item, rest) : scope.$item
  }
  if (path === '$index') {
    return scope.$index
  }
  return pickByPath(scope, path)
}

function renderNode(node, scope, out) {
  if (node.text !== undefined) {
    if (node.text.trim()) {
      out.push(document.createTextNode(node.text))
    }
    return
  }

  const attrs = node.attrs

  // data-if
  if (attrs['data-if'] !== undefined) {
    const v = resolvePath(attrs['data-if'], scope)
    if (!v) {
      return
    }
  }

  // data-each：把同一个元素按数组重复，不引入包裹元素（包裹元素会破坏
  // 父级 flex 布局，例如栅格与横向行）。
  // 关键点：递归时必须把 data-each 从节点上摘掉，否则会重复进入这一分支，
  // 造成无限递归（RangeError: Maximum call stack size exceeded）。
  if (attrs['data-each'] !== undefined && node.loopDone !== true) {
    const list = resolvePath(attrs['data-each'], scope)
    const arr = Array.isArray(list) ? list : []
    const clone = { tag: node.tag, attrs: attrs, children: node.children, loopDone: true }
    arr.forEach(function (item, i) {
      const inner = Object.create(scope)
      inner.$item = item
      inner.$index = i
      renderNode(clone, inner, out)
    })
    return
  }

  let tag = node.tag
  if (tag === 'each') {
    tag = 'div'
  }
  let dom
  if (tag === 'image' || tag === 'img') {
    dom = document.createElement('div')
  } else if (tag === 'input') {
    dom = document.createElement('div')
  } else {
    dom = document.createElement(tag)
  }

  Object.keys(attrs).forEach(function (k) {
    const v = attrs[k]
    /*
     * data-touch 走透传：留在 DOM 上（真机读得到），
     * 但实际的事件绑定在 rootEl 上统一做，见 bindInput()。
     */
    if (k === 'data-if' || k === 'data-each' || k === 'data-act' || k === 'data-tid' || k === 'data-touch') {
      return
    }
    if (k === 'data-bind') {
      return
    }
    if (k === 'data-style') {
      const sv = resolvePath(v, scope)
      if (sv) {
        dom.setAttribute('style', sv)
      }
      return
    }
    if (k === 'data-class') {
      const cv = resolvePath(v, scope)
      if (cv) {
        dom.className = (dom.className ? dom.className + ' ' : '') + cv
      }
      return
    }
    if (k === 'class') {
      dom.className = (dom.className ? dom.className + ' ' : '') + v
      return
    }
    if (k === 'scroll-y') {
      dom.style.overflowY = 'auto'
      return
    }
    dom.setAttribute(k, v)
  })

  // 文本绑定：{{expr}} 会被转成内嵌的 <b data-bind>
  node.children.forEach(function (c) {
    if (c.tag === 'b' && c.attrs['data-bind'] !== undefined) {
      const v = resolvePath(c.attrs['data-bind'], scope)
      dom.appendChild(document.createTextNode(v === undefined || v === null ? '' : String(v)))
    } else {
      renderNode(c, scope, { push: function (n) { dom.appendChild(n) } })
    }
  })

  if (attrs['data-act']) {
    /*
     * 触控屏上不需要手型光标，设为 none 与全局 cursor:none 保持一致。
     * （原先设的是 'pointer'，会在触屏上重新露出光标。）
     */
    dom.style.cursor = 'none'
    /*
     * 打一个真实落到 DOM 上的标记属性。
     *
     * 为什么需要：data-act / data-tid / data-style 这些在预览渲染时
     * **只进委托表、不写进 DOM**。于是「先 closest 找到可交互元素、
     * 再查委托表」这类写法在预览里必然失配 —— 表现为按下毫无反应，
     * 而真机上却是好的（真机走引擎自己的事件分发）。
     * 有了这个标记，两种环境下的命中判断才是同一套逻辑。
     *
     * 名字带 vg- 前缀，不会和引擎保留属性冲突。
     */
    dom.setAttribute('data-vg-hit', '1')
  }
  /*
   * tid 也是数据绑定（例如 tid="{{$item.uri}}"），必须求值后再登记；
   * 直接存原始表达式会让处理函数收到字面量 "$item.uri"，
   * 表现为「点了没反应」——这类静默失败很难排查，务必在这里解析。
   */
  const rawTid = attrs['data-tid']
  const tid = rawTid === undefined ? undefined : resolvePath(rawTid, scope)
  /*
   * data-touch：真机上是「按下即响应」的语义。
   * 这里先解析成方法名存进委托表，实际绑定在 rootEl 上统一做（见 bindInput）。
   */
  nodeData.set(dom, {
    act: attrs['data-act'],
    touch: attrs['data-touch'],
    tid: tid,
    scope: scope
  })
  out.push(dom)
}

/** 供自动化测试查询委托表：判断某个元素是否被登记为可交互 */
function debugMeta(node) {
  return nodeData.get(node) || null
}

const toastEl = document.getElementById('toast')
const styleEls = {}

let component = null
let data = null
let tree = null
// 包着 data 的 Proxy。测试要改数据必须走它，否则不会重渲染（见 __velaguard.patch 的说明）
let dataProxy = null

function showToast(message) {

  toastEl.classList.add('show')

  showToast.t = setTimeout(function () {

/** 供页面脚本使用的宿主桩件 */
function makeHost(pageKey) {

  }

function deepClone(o) {
  return JSON.parse(JSON.stringify(o))
}

function build(pageKey) {
  const page = PAGES[pageKey]
  if (!page) {
    return
  }
  current = pageKey

  // 样式只注入一次（构建期已作用域化到 [data-page="<页面名>"]）
  if (!styleEls[pageKey]) {
    const s = document.createElement('style')
    s.textContent = page.css
    document.head.appendChild(s)
    styleEls[pageKey] = s
  }

  // 编译脚本：import 已在构建期剥离，这里注入宿主桩件
  const host = makeHost(pageKey)
  /* eslint-disable no-new-func */
  const factory = new Function(
    'router', 'prompt', 'velaclaw', 'store', 'source',
    '"use strict";' + page.script
  )
  component = factory(host.router, host.prompt, host.velaclaw, host.store, host.source)

  data = deepClone(component.private || {})
  // 递归代理：页面直接改 this.xxx 也要能触发重渲染
  const proxy = new Proxy(data, {
    set: function (target, key, value) {
      target[key] = value
      queueRender()
      return true
    }
  })
  dataProxy = proxy
  component.data = proxy

  // 把方法绑到 data 上，this 指向代理，页面里 this.x = 1 即可生效
  Object.keys(component).forEach(function (k) {
    if (typeof component[k] === 'function') {
      proxy[k] = component[k].bind(proxy)
    }
  })

  if (typeof component.onInit === 'function') {
    component.onInit.call(proxy)
  }

  tree = parse(page.html)
  doRender()
  if (typeof component.onShow === 'function') {
    component.onShow.call(proxy)
  }

  // 事件委托
  bindInput()
  rootEl.setAttribute('data-page', pageKey)
  document.querySelectorAll('#pagelist button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.page === pageKey)
  })
